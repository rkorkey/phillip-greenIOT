<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phillip Nguyen – Sales Engineer</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #4A75B5;
      --secondary-color: #8DC3A7;
      --accent-color: #5B7EC0;
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --card-bg: rgba(255, 255, 255, 0.8);
      --card-blur: 15px;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .main-container {
      width: 100%;
      max-width: 450px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.8s forwards ease-out;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      padding-bottom: 20px;
    }

    .header-section {
      padding: 50px 30px 30px;
      text-align: center;
      background: linear-gradient(135deg, rgba(141, 195, 167, 0.1) 0%, rgba(74, 117, 181, 0.1) 100%);
    }

    .header-section h2 {
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header-section p.lead {
      font-weight: 400;
      font-size: 16px;
      color: var(--primary-color);
      margin-bottom: 25px;
    }

    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .action-btn {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--primary-color);
      font-size: 1.2rem;
      transition: var(--transition);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .action-btn:hover {
      transform: translateY(-5px);
      background: var(--primary-color);
      color: #fff;
      box-shadow: 0 10px 20px rgba(74, 117, 181, 0.2);
    }

    .contact-list {
      padding: 20px 25px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 15px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .contact-item:hover {
      background: #fff;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      border-color: rgba(74, 117, 181, 0.1);
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(74, 117, 181, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      color: var(--primary-color);
      font-size: 1.1rem;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .contact-value {
      font-size: 15px;
      font-weight: 500;
    }

    .add-contact-section {
      padding: 10px 25px 25px;
    }

    .btn-save {
      width: 100%;
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      box-shadow: 0 10px 25px rgba(74, 117, 181, 0.25);
    }

    .btn-save:hover {
      background: #3d629a;
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(74, 117, 181, 0.35);
    }

    .footer-text {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .main-container {
        padding: 10px;
      }

      .profile-card {
        border-radius: 25px;
      }

      .header-section {
        padding: 40px 20px 25px;
      }

      .header-section h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="main-container">
    <div class="profile-card">
      <section class="header-section">
        <h2>Phillip Nguyen</h2>
        <p class="lead">Sales Engineer - Solar & Battery</p>

        <div class="quick-actions">
          <a href="tel:+61468569937" class="action-btn">
            <i class="bi bi-telephone-fill"></i>
          </a>
          <a href="mailto:phillip.nguyen@greeniot.com.au" class="action-btn">
            <i class="bi bi-envelope-fill"></i>
          </a>
        </div>
      </section>

      <div class="contact-list">
        <!-- Phone -->
        <a href="tel:+61468569937" class="contact-item">
          <div class="icon-box">
            <i class="bi bi-phone"></i>
          </div>
          <div class="contact-info">
            <span class="contact-label">Phone</span>
            <span class="contact-value">0 468 569 937</span>
          </div>
        </a>

        <!-- Email -->
        <a href="mailto:phillip.nguyen@greeniot.com.au" class="contact-item">
          <div class="icon-box">
            <i class="bi bi-envelope-at"></i>
          </div>
          <div class="contact-info">
            <span class="contact-label">Email</span>
            <span class="contact-value">phillip.nguyen@greeniot.com.au</span>
          </div>
        </a>

        <!-- Website -->
        <a href="https://www.greeniot.com.au" target="_blank" class="contact-item">
          <div class="icon-box">
            <i class="bi bi-globe"></i>
          </div>
          <div class="contact-info">
            <span class="contact-label">Website</span>
            <span class="contact-value">www.greeniot.com.au</span>
          </div>
        </a>

        <!-- Company -->
        <div class="contact-item">
          <div class="icon-box">
            <i class="bi bi-building"></i>
          </div>
          <div class="contact-info">
            <span class="contact-label">Company</span>
            <span class="contact-value">GreenIOT</span>
          </div>
        </div>
      </div>

      <div class="add-contact-section">
        <button id="addContact" class="btn-save">
          <i class="bi bi-person-plus-fill"></i>
          Add to Contacts
        </button>
      </div>
    </div>

    <div class="footer-text">
      Phillip's Business Card &copy; 2026
    </div>
  </div>

  <script>
    document.getElementById('addContact').addEventListener('click', () => {
      const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Phillip Nguyen
N:Nguyen;Phillip;;;
TITLE:Sales Engineer - Solar & Battery
TEL;TYPE=WORK,VOICE:+61 468 569 937
EMAIL;TYPE=WORK:phillip.nguyen@greeniot.com.au
URL:www.greeniot.com.au/copy-of-project-photos
NOTE:Sales Engineer - Solar & Battery
END:VCARD`;
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      window.location.href = url;
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>

</body>

</html>
